<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Drama Class Soundtracks</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script defer src="./script-mobile.js"></script>
    <style>
        body {
            padding: 40px;
        }

        /* Animation */

        @keyframes fadeInUp {
            from {
                transform: translate3d(0,40px,0)
            }

            to {
                transform: translate3d(0,0,0);
                opacity: 1
            }
        }

        @-webkit-keyframes fadeInUp {
            from {
                transform: translate3d(0,40px,0)
            }

            to {
                transform: translate3d(0,0,0);
                opacity: 1
            }
        }

        .animated {
            animation-duration: 1s;
            animation-fill-mode: both;
            -webkit-animation-duration: 1s;
            -webkit-animation-fill-mode: both
        }

        .animatedFadeInUp {
            opacity: 0
        <div id="loading-bar" aria-hidden="true"><div class="loading-bar__fill"></div></div>
        }

        .fadeInUp {
            opacity: 0;
            animation-name: fadeInUp;
            -webkit-animation-name: fadeInUp;
        }
    </style>
</head>
<body>
    <div class="container animated fadeInUp">
        <h1>Drama Class Soundtracks</h1>
        <h1 style="font-size: 1rem; color: #7c7c7c">Version 13.2</h1>
        <div style="max-width: 600px; margin: 0 auto 20px; font-size: 0.95rem; color: #4a4a4a; text-align: left;">
            <strong>Changelog:</strong>
            <ul style="padding-left: 18px; margin: 6px 0 0 0;">
                <li>Hardened playback logic to avoid unsupported source errors.</li>
            </ul>
        </div>
        <p class="animated fadeInUp" style="font-size: 24px; text-align: center;">Select a music to play:</p>
        <ul class="animated fadeInUp">
            <li><button onclick="playTrack('MissionImpossible')">Mission Impossible</button></li>
            <li><button onclick="playTrack('NervousMusic')">Nervous Music</button></li>
            <li><button onclick="playTrack('PinkPanther')">Pink Panther</button></li>
        </ul>
        <p class="animated fadeInUp" style="font-size: 24px; text-align: center;">Select a sound effect to play:</p>
        <ul class="animated fadeInUp">
            <li><button onclick="playTrack('PSSIncreased')">Police Station</button></li>
            <li><button onclick="playTrack('DoorKnocking')">Door Knocking</button></li>
            <li><button onclick="playTrack('TelephoneRinging')">Telephone Ringing</button></li>
            <li><button onclick="playTrack('PoliceRadioChatter')">Police Radio Chatter</button></li>
            <li><button onclick="playTrack('PoliceSiren')">Police Siren</button></li>
            <li><button onclick="playTrack('donut')">Donut Alarm</button></li>
        </ul>
        <div class="options">
    
            <button onclick="instantStop()">Stop All</button>        
        </div>        
            <!-- Music Audio Elements -->
            <audio id="MissionImpossible" src="./Sounds/mission-impossible-soundtrack.mp3" preload="auto" onended="stopTrack()"></audio>
            <audio id="NervousMusic" src="./Sounds/nervous-music.mp3" preload="auto" onended="stopTrack()"></audio>
            <audio id="PinkPanther" src="./Sounds/pinkpanther.mp3" preload="auto" onended="stopTrack()"></audio>
            <audio id="PSSIncreased" src="./Sounds/policestn.mp3" preload="auto" loop></audio>            <!-- Sound Effect Audio Elements -->
            <audio id="DoorKnocking" src="./Sounds/door-knocking-sound.mp3" preload="auto" onended="stopTrack()"></audio>
            <audio id="TelephoneRinging" src="./Sounds/telephone-ringing.mp3" preload="auto" onended="stopTrack()"></audio>
            <audio id="PoliceRadioChatter" src="./Sounds/police-radio-chatter.mp3" preload="auto" onended="stopTrack()"></audio>
            <audio id="PoliceSiren" src="./Sounds/police-siren.mp3" preload="auto" onended="stopTrack()"></audio>
            <audio id="donut" src="./Sounds/donut.mp3" preload="auto" onended="stopTrack()"></audio>
    </div>
        <script>
            // Simple loading bar: animates until window load, then fades out
            (function() {
                const bar = document.getElementById('loading-bar');
                if (!bar) return;
                window.addEventListener('load', function() {
                    bar.classList.add('loading-bar--done');
                    setTimeout(() => {
                        if (bar && bar.parentNode) {
                            bar.parentNode.removeChild(bar);
                        }
                    }, 400);
                });
            })();
        </script>
    <script>
        // Fallback: define playback helpers inline if external script fails to load
        if (typeof window.playTrack !== 'function') {
            function clampVolume(volume) {
                if (volume > 1) return 1;
                if (volume < 0) return 0;
                return volume;
            }
            function stopAllTracks() {
                const tracks = document.getElementsByTagName('audio');
                for (let i = 0; i < tracks.length; i++) {
                    const track = tracks[i];
                    track.pause();
                    track.currentTime = 0;
                    if (track.fadeOutInterval) {
                        clearInterval(track.fadeOutInterval);
                        delete track.fadeOutInterval;
                    }
                    track.onended = null;
                }
            }
            function playTrack(trackId, fadeInTime, fadeOutTime) {
                const audio = document.getElementById(trackId);
                if (!audio) {
                    console.error('No audio element found for id', trackId);
                    return;
                }
                stopAllTracks();
                audio.currentTime = 0;
                audio.volume = 0;
                const playPromise = audio.play();
                const fadeInDuration = Number(fadeInTime) || 0;
                if (fadeInDuration > 0) {
                    const stepMs = 50;
                    const steps = Math.ceil(fadeInDuration / stepMs);
                    let currentStep = 0;
                    const fadeInInterval = setInterval(() => {
                        currentStep += 1;
                        audio.volume = clampVolume(currentStep / steps);
                        if (currentStep >= steps) {
                            clearInterval(fadeInInterval);
                        }
                    }, stepMs);
                } else {
                    audio.volume = 1;
                }
                const fadeOutDuration = Number(fadeOutTime) || 0;
                audio.onended = function() {
                    if (fadeOutDuration > 0) {
                        const stepMs = 50;
                        const steps = Math.ceil(fadeOutDuration / stepMs);
                        let currentStep = steps;
                        const fadeOutInterval = setInterval(() => {
                            currentStep -= 1;
                            audio.volume = clampVolume(currentStep / steps);
                            if (currentStep <= 0) {
                                clearInterval(fadeOutInterval);
                                audio.pause();
                                audio.currentTime = 0;
                            }
                        }, stepMs);
                        audio.fadeOutInterval = fadeOutInterval;
                    } else {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                };
                if (playPromise && playPromise.catch) {
                    playPromise.catch((err) => {
                        console.warn('Playback blocked or unsupported source', err);
                    });
                }
            }
            function instantStop() {
                stopAllTracks();
            }
            function stopTrack() {}
        }
    </script>
</body>
</html>
